# 复制本文件为 config.yaml，再把所有占位值替换为真实值。
# config.yaml 已被 .gitignore 忽略：不会进入版本库，只在本机留存。
# 所有代码与工具脚本都必须从这里读配置，禁止硬编码凭据。

# Hadoop / HDFS
hdfs:
  namenode: hdfs://localhost:9000
  data_dir: /movielens
  ratings_path: /movielens/ratings.csv
  movies_path: /movielens/movies.csv

# MySQL
mysql:
  host: localhost
  port: 3306
  user: movie_app
  password: "change_me"
  database: movie_recommend
  charset: utf8mb4

# PySpark ALS 参数
als:
  rank: 50
  max_iter: 10
  reg_param: 0.1
  cold_start_strategy: drop
  train_ratio: 0.8
  top_n: 20
  # 候选集门槛已移除（2026-10-01）：原先的 min_rating_count（可辨识性门槛）
  # 整体删除，在线推荐现在对全量因子排序。

# ItemCF 在线推荐（可选）
# model_dir 指向 experiments/itemcf 全量训练产物目录（含 model.json 与 7 个 .npy，
# 哈希链在 model.json 里）。留空 = 不启用 GET /api/recommendations/?model=itemcf。
itemcf:
  model_dir: ""
  top_n: 20

# V4 三路融合推荐（可选）：ItemCF裸求和 + 门控ALS折入 + 类型匹配。
# enabled=true 时提供 GET /api/recommendations/?model=fusion。
fusion:
  enabled: false
  weights: [0.4, 0.5, 0.1]
  als_min_support: 1000
  als_top_k: 500
  top_n: 20

# Flask
# 注意：port 必须与 frontend/vite.config.js 的 proxy target 保持一致。
# 本机（Windows）禁止绑定 5000/5001，因此统一使用 8000。
  # V5 叠加层（EDA 2026-10-10）：差评反馈 + 频率标签 + 热门降权。
  # enabled=false = 行为与 V4 逐位一致；holdout 消融验证通过后再开。
  #   popularity_alpha  热门降权指数 final = fused / (pop/median)^alpha（0=关）
  #   als_neg_lambda    ALS 负反馈罚项系数（0=关）；传播用中心化余弦
  #   als_neg_cap       单候选罚项上限 = cap × 差评信号总量
  #   recent_window     "近期"窗口大小（最近 N 条同标签评分）
  #   genre_quota       高差评标签每页类型配额（0=关）
  v5:
    enabled: false
    popularity_alpha: 0.2
    als_neg_lambda: 0.2
    als_neg_cap: 0.5
    recent_window: 10
    genre_quota: 8
flask:
  host: "127.0.0.1"
  port: 8000
  debug: false
  secret_key: "replace_with_a_random_secret"
  # 用户上传头像的存放目录。可留空或删掉本行，默认 backend/uploads/avatars
  # （该目录已进 .gitignore，属于运行时数据，不提交）。
  avatar_upload_dir: ""

# JWT
# access token 有效期（小时），不配置时后端默认 168 小时 = 7 天。
# 正式部署建议缩短（如 24），并配合前端 401 拦截重新登录。
jwt:
  access_token_expires_hours: 168

# CORS
cors:
  origins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"

# TMDB（fetch_posters.py 抓取海报 / 简介 / 演职员用）
tmdb:
  # 在 https://www.themoviedb.org/settings/api 申请，v3 API Key 为 32 位十六进制
  api_key: "YOUR_TMDB_API_KEY_HERE"
  base_url: "https://api.themoviedb.org/3"
  poster_base_url: "https://image.tmdb.org/t/p/w500"

# 虚拟机（scripts/sync_code_to_vm.py 同步代码到 VM 用；仅本地开发需要）
vm:
  host: "192.168.10.102"
  ssh_user: "change_me"
  ssh_password: "change_me"
  mysql_user: "change_me"
  mysql_password: "change_me"
  mysql_database: movie_recommend
